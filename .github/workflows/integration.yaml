name: Continuous Integration
on:
  push:
permissions:
  contents: read
  packages: read
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  ui-regression:
    name: Local UI and authentication regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run generate
      - run: bunx playwright install --with-deps chromium
      - name: Assert route, sticky, visual guard and real local authentication
        run: |
          bun run e2e:regression
          bun run e2e:vote-limit
          bash e2e/local/run.sh e2e/routes.test.ts e2e/sticky-check.spec.ts e2e/local-auth.spec.ts
      - name: Capture pending candidates with separate stability comparators
        run: bun run e2e:candidates
      - name: Compare human-approved baselines
        if: hashFiles('e2e/approved/*.png') != ''
        run: bash e2e/local/run.sh e2e/visual-check.spec.ts
      - name: Record pending baseline review
        if: hashFiles('e2e/approved/*.png') == ''
        run: echo '::notice::Visual candidates await human review. No approved visual baseline exists; production visual regression approval is pending.'
      - name: Build review gallery
        if: always()
        run: bun e2e/local/gallery.ts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ui-candidates-pending-human-approval
          include-hidden-files: true
          path: |
            .cache/a15/candidates
            .cache/a15/gallery.html
            test-results
            playwright-report
  commitlint:
    name: CommitLint
    if: github.event.action != 'closed' || github.event.pull_request.merged != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate current commit (last commit) with commitlint
        if: github.event_name == 'push'
        run: bun commitlint --last --verbose
      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: bun commitlint --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} --to ${{ github.event.pull_request.head.sha }} --verbose
  check:
    name: Code Check
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' || github.event.pull_request.merged != true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check
        run: |
          bun biome check workers/app/src workers/bot/src packages/shared/src __tests__
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' || github.event.pull_request.merged != true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      # schema.prisma を変更したのにマイグレーションを生成し忘れた PR を落とす。
      # --from-migrations はコミット済み履歴の再生結果が起点なので DB もクレデンシャルも不要。
      # 差分があれば --exit-code が 2 を返してジョブが失敗する。
      - name: Check migrations are up to date
        run: |
          bunx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema ./prisma/schema.prisma \
            --config ./prisma/prisma.config.ts \
            --exit-code
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' || github.event.pull_request.merged != true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Generate Prisma Client
        run: bun run generate
      - name: Test
        run: |
          bun run test
  knip:
    name: Knip
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Generate Prisma Client
        run: bun run generate
      - name: Knip
        run: bun knip
  tsc:
    name: Compile TypeScript
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' || github.event.pull_request.merged != true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Generate Prisma Client
        run: bun run generate
      - name: Test
        run: |
          bun run typecheck
  build:
    name: Vite Build (production)
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' || github.event.pull_request.merged != true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      # Build asset caches mirror deployment.yaml so this job catches
      # build-time failures (e.g. vite-plugin-pwa × intlayer) before merge.
      - name: Cache character images
        uses: actions/cache@v5
        with:
          path: |
            workers/app/public/images/characters
            workers/app/public/images/stamps
          key: >-
            ${{ runner.os }}-character-images-${{
              hashFiles(
                'scripts/download-character-images.ts',
                'scripts/stampcamera-map.ts',
                'workers/app/public/characters.json'
              )
            }}
      - name: Cache OG images
        uses: actions/cache@v5
        with:
          path: |
            workers/app/public/og/characters
          key: >-
            ${{ runner.os }}-og-${{
              hashFiles(
                'scripts/generate-og-images.ts',
                'scripts/stampcamera-map.ts',
                'workers/app/public/characters.json'
              )
            }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Generate Prisma Client
        run: bun run generate
      - name: Build
        run: |
          bunx rimraf workers/app/dist
          bun run scripts/download-character-images.ts
          bun run scripts/generate-og-images.ts
          bun tsc -b
          CLOUDFLARE_ENV=production bun vite build --mode production
          CLOUDFLARE_ENV=production bun run test:app-build
          bun run check:bot-stores
          bun run test:og-render
          CLOUDFLARE_ENV=production bun run build:bot
          bun run test:bot-rpc
          CLOUDFLARE_ENV=staging bun vite build --mode production
          CLOUDFLARE_ENV=staging bun run test:app-build
          CLOUDFLARE_ENV=staging bun run build:bot
          CLOUDFLARE_ENV=staging bun run test:bot-rpc
        env:
          CLOUDFLARE_ENV: production
