name: Deploy to Cloudflare Workers
on:
  pull_request:
    branches:
      - develop
      - master
    types: [closed]

permissions:
  contents: read
  packages: read
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  deploy:
    name: Deploy Workers
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.10.0
      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      # 自前ホストするキャラ画像 (biccame.jp + stampcamera) のキャッシュ。
      # characters.json と stampcamera-map.ts が変わらない限り再 DL 不要。
      - name: Cache character images
        uses: actions/cache@v5
        with:
          path: |
            workers/app/public/images/characters
            workers/app/public/images/stamps
          key: >-
            ${{ runner.os }}-character-images-${{
              hashFiles(
                'scripts/download-character-images.ts',
                'scripts/stampcamera-map.ts',
                'workers/app/public/characters.json'
              )
            }}
      # OG 画像の生成結果を再利用するキャッシュ。生成ロジック (script / map / characters.json)
      # のハッシュを key にしているので、いずれかが変わると key が変わって再生成される。
      # 変更なしなら scripts/generate-og-images.ts が既存 PNG を検知してスキップする。
      - name: Cache OG images
        uses: actions/cache@v5
        with:
          path: |
            workers/app/public/og/characters
          key: >-
            ${{ runner.os }}-og-${{
              hashFiles(
                'scripts/generate-og-images.ts',
                'scripts/stampcamera-map.ts',
                'workers/app/public/characters.json'
              )
            }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Generate Prisma Client
        run: bun run generate
      - name: Build Workers
        run: |
          bunx rimraf workers/app/dist
          bun run scripts/download-character-images.ts
          bun run scripts/generate-og-images.ts
          bun tsc -b
          bun vite build --mode "${CLOUDFLARE_ENV}"
          bun run test:app-build
        env:
          CLOUDFLARE_ENV: ${{ github.event.pull_request.base.ref == 'master' && 'production' || 'staging' }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      # 未適用の migration.sql だけが流れる (適用済みは D1 の d1_migrations 台帳で判定される)。
      # デプロイより先に流すのは、新カラムを参照する Worker が旧スキーマに当たらないようにするため。
      - name: Apply D1 migrations
        if: env.ACT != 'true'
        run: bunx wrangler --config workers/app/wrangler.toml d1 migrations apply DB --env="${CLOUDFLARE_ENV}" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ENV: ${{ github.event.pull_request.base.ref == 'master' && 'production' || 'staging' }}
      # バッジ評価は badges テーブルを唯一の対象にしているので、行が無いバッジは
      # 条件を満たしても永久に付与されない。registry からの upsert なので毎回流してよい。
      # 既存ユーザーへの遡及付与は日次 cron と POST /api/admin/badges/recalculate が担う。
      - name: Seed badges
        if: env.ACT != 'true'
        run: bun run badges:seed "${SEED_TARGET}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SEED_TARGET: ${{ github.event.pull_request.base.ref == 'master' && 'remote-production' || 'remote-staging' }}
      - name: Deploy Workers
        if: env.ACT != 'true'
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ENV: ${{ github.event.pull_request.base.ref == 'master' && 'production' || 'staging' }}
          NODE_ENV: production
      - name: Build bot with the deployed app read binding
        if: env.ACT != 'true'
        run: |
          bun run check:bot-stores
          bun run build:bot
          bun run test:bot-rpc
        env:
          CLOUDFLARE_ENV: ${{ github.event.pull_request.base.ref == 'master' && 'production' || 'staging' }}
      - name: Deploy bot after app
        if: env.ACT != 'true'
        run: bun scripts/deploy-bot.ts --env="${CLOUDFLARE_ENV}" ${BOT_ACTIVATION}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ENV: ${{ github.event.pull_request.base.ref == 'master' && 'production' || 'staging' }}
          BOT_ACTIVATION: ${{ github.event.pull_request.base.ref == 'master' && '--allow-active-production' || '' }}
