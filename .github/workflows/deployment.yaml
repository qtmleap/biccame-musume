name: Deploy Workers (api, db, app)
on:
  pull_request:
    branches:
      - master
      - main
      - develop
    types: [closed]
  workflow_dispatch:

jobs:
  deploy:
    name: Wrangler Deploy (all workers)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Determine environment
        run: |
          if [[ '${{ github.event.pull_request.base.ref }}' == '${{ github.event.repository.default_branch }}' ]] \
            || [[ '${{ github.event_name }}' == 'workflow_dispatch' && '${{ github.ref_name }}' == '${{ github.event.repository.default_branch }}' ]]; then
            echo "CLOUDFLARE_ENV=production" >> $GITHUB_ENV
          else
            echo "CLOUDFLARE_ENV=staging" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run --cwd workers/db generate

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run --cwd workers/db migrate:remote

      - name: Build app worker
        run: bun run --cwd workers/app build

      # `bun --filter './workers/*' run deploy` deploys api / db / app in
      # parallel. Order matters if bindings reference each other for the
      # first time — sequentialize if that ever bites.
      - name: Deploy all workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun --filter './workers/*' run deploy
