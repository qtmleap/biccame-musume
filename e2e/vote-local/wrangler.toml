name = "a15-vote-local-only"
main = "worker.ts"
compatibility_date = "2026-05-11"
compatibility_flags = ["nodejs_compat"]
[alias]
"virtual:public-characters" = "./assets/characters.json"
[[d1_databases]]
binding = "DB"
database_name = "a15-vote-disposable"
database_id = "00000000-0000-0000-0000-000000000016"
migrations_dir = "../../prisma/migrations"
migrations_pattern = "../../prisma/migrations/*/migration.sql"
[[durable_objects.bindings]]
name = "VOTE_COUNTER"
class_name = "VoteCounterDO"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["VoteCounterDO"]
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1015"
simple = { limit = 50, period = 60 }
[assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = true
[vars]
ENVIRONMENT = "local"
VOTE_LIMIT_BYPASS = "false"
ORIGIN_ALLOWLIST = "http://127.0.0.1:15302"
